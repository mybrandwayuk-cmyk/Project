.price td:last-child{text-align:right;white-space:nowrap}.price tr.tot td{font-weight:800;font-size:1.05rem}

/* ===== v2 design layer ===== */
:root{--sh:0 1px 2px rgba(11,31,58,.06),0 6px 18px rgba(11,31,58,.07);--sh2:0 12px 32px rgba(11,31,58,.18);--grad:linear-gradient(155deg,#1668F0 0%,#0D3FA6 100%)}

:root[data-theme="dark"]{--sh:0 1px 2px rgba(0,0,0,.45),0 6px 18px rgba(0,0,0,.35);--sh2:0 12px 32px rgba(0,0,0,.55)}
body{font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}

.ib{width:42px;height:42px;transition:transform .15s,background .15s}.ib:active{transform:scale(.92)}
.ib.me{box-shadow:0 2px 8px rgba(18,87,216,.35)}
.btn{font-weight:700;letter-spacing:.005em;box-shadow:none;transition:transform .12s,background .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}

.btn.ghost{background:var(--bg)}

.card{border-color:transparent}

    else{acceptEmergency(j.id,o.pid,'30',1);say(j,by(S.providers,o.pid).name+' accepted. Review the price and pay.');ch=true}}}

   if(o&&step(j,3500)){const p=by(S.providers,o.pid),lines=[{label:'Call-out fee',kind:'callout',amount:p.callout},{label:'Labour estimate (1.5 h)',kind:'labour',amount:Math.round(p.hourly*1.5)}];
